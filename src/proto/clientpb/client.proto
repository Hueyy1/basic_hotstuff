syntax = "proto3";

package clientpb;

import "gorums.proto";
import "google/protobuf/empty.proto";

option go_package = "hxy352/src/proto/clientpb";

service Client {

  rpc SendResponse(Response) returns (google.protobuf.Empty) {
    option (gorums.unicast) = true;
  }

}

message Response {
  string result = 1;
  string cmd = 2;
  uint32 ReplicaId = 3;
}